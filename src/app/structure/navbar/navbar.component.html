<div class="navbar justify-content-around">
    <img class="img-navbar" src="../../../assets/Naranja.png"/>
    <div class="justify-content-between btn-container">
        <button class="text-button" [ngClass]="{'selected-btn': selected == '/home'}" (click)="move('/home')">Home</button>
        <button class="text-button" [ngClass]="{'selected-btn': selected == '/how-it-works'}" (click)="move('/how-it-works')">How it Works</button>
        <button class="text-button" [ngClass]="{'selected-btn': selected == '/groups'}" (click)="move('/groups')">Groups</button>
        <button class="text-button" [ngClass]="{'selected-btn': selected == '/activities'}" (click)="move('/activities')">Activities</button>
        <button class="text-button" [ngClass]="{'selected-btn': selected == '/blogs'}" (click)="move('/blogs')">Blog</button>
        <button class="text-button" [ngClass]="{'selected-btn': selected == '/contact'}" (click)="move('/contact')">Contact</button>
        <button class="text-button" (click)="!userData ? logInOutUser(true) : logInOutUser(false)">{{message}}</button>
        <button *ngIf="message == 'Log Out'" class="text-button book-btn" (click)="move('/book-now')">Book Now</button>
    </div>

        <button class="solid-button">Crear +</button>
        <button class="bton" (click)="logout()">logout</button>
    </div> -->
</div>
